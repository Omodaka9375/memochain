[package]
name = "memochain-ivc-program"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bincode = "1.3"
chain-logic = { path = "../../chain-logic" }
memochain-core = { path = "../../memochain-core" }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10.9"
sp1-zkvm = { version = "6.10.0", features = ["verify"] }

[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.9-sp1-6.10.0" }
