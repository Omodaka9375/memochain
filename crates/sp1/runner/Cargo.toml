[package]
name = "memochain-runner"
version = "0.1.0"
edition = "2021"
description = "Native MemoChain chain runner: executes the same chain-logic the SP1 guest proves. Runs on Windows today; the SP1 host runs the same inputs in the zkVM on Linux/DGX Spark."

[dependencies]
chain-logic = { path = "../../chain-logic" }
serde_json = "1.0"
hex = "0.4"

[[bin]]
name = "run-chain"
path = "src/main.rs"
