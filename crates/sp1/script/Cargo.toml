[package]
name = "memochain-sp1-script"
version = "0.1.0"
edition = "2021"
publish = false
description = "SP1 host script: build the MemoChain guest ELF, execute or prove it, and verify the proof. Requires Linux or macOS (SP1 does not run natively on Windows)."

[dependencies]
bincode = "1.3"
chain-logic = { path = "../../chain-logic" }
memochain-core = { path = "../../memochain-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sp1-sdk = { version = "6.10.0", features = ["network"] }
tokio = { version = "1.42", features = ["rt-multi-thread", "macros"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
eyre = "0.6"

[build-dependencies]
sp1-build = "6.10.0"

[[bin]]
name = "execute"
path = "src/bin/execute.rs"

[[bin]]
name = "prove"
path = "src/bin/prove.rs"

[[bin]]
name = "ivc"
path = "src/bin/ivc.rs"
